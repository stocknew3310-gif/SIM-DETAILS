<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2563eb">
<meta name="description" content="AHSAN x NOVA — Database Pro. Fast lookup by mobile number or CNIC.">
<meta name="format-detection" content="telephone=no">
<title>AHSAN x NOVA — DATABASE PRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --primary: #2563eb;
    --primary-dark: #1e40af;
    --primary-light: #3b82f6;
    --accent: #0ea5e9;
    --bg: #f1f5f9;
    --bg-2: #e2e8f0;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-muted: #64748b;
    --danger: #ef4444;
    --success: #10b981;
    --shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
    --shadow-lg: 0 10px 40px rgba(15, 23, 42, 0.10);
    --radius: 16px;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: var(--bg);
    background-image:
        radial-gradient(circle at 0% 0%, rgba(37, 99, 235, 0.08), transparent 40%),
        radial-gradient(circle at 100% 100%, rgba(14, 165, 233, 0.06), transparent 40%);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
}

.main-wrapper {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 16px 40px;
}

.header-banner {
    text-align: center;
    padding: 60px 24px 28px;
    margin: 20px auto 24px;
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow-lg);
    position: relative;
}

.title-logo {
    width: 110px;
    height: 110px;
    object-fit: cover;
    border-radius: 50%;
    display: block;
    margin: -115px auto 14px;
    border: 4px solid var(--surface);
    box-shadow: 0 8px 30px rgba(37, 99, 235, 0.25);
    background: #000;
    position: relative;
    z-index: 2;
}

.main-title-first {
    font-size: 34px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: 2px;
    line-height: 1.15;
    margin-top: 4px;
}

.main-title-second {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 3px;
    margin-top: 6px;
    color: var(--primary);
}

.main-title-second .pro-color { color: var(--accent); }

.status-bar {
    display: flex;
    justify-content: center;
    gap: 18px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-top: 22px;
    color: var(--text-muted);
    flex-wrap: wrap;
}

.status-item { display: flex; align-items: center; gap: 6px; }

.status-dot {
    width: 7px;
    height: 7px;
    background: var(--success);
    border-radius: 50%;
}

.status-dot.warning { background: var(--accent); }
.status-dot.cyan { background: var(--primary); }

.console-box {
    margin: 20px auto;
    background: var(--surface);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
}

.console-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--text-muted);
}

.console-header .dots { display: flex; gap: 6px; }

.dot { width: 10px; height: 10px; border-radius: 50%; }
.dot.red { background: #ef4444; }
.dot.yellow { background: #f59e0b; }
.dot.green { background: #10b981; }

.input-group { position: relative; margin-bottom: 14px; }

.input-group i {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 15px;
}

.console-input {
    width: 100%;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 16px 16px 16px 48px;
    color: var(--text);
    font-size: 15px;
    font-weight: 500;
    outline: none;
    transition: all 0.2s;
}

.console-input:focus {
    border-color: var(--primary);
    background: var(--surface);
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
}

.console-input::placeholder { color: var(--text-muted); }

.btn-search {
    width: 100%;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.2s;
    box-shadow: 0 6px 20px rgba(37, 99, 235, 0.30);
}

.btn-search:hover {
    background: var(--primary-dark);
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(37, 99, 235, 0.35);
}

.btn-search:active { transform: translateY(0); }

.circle-loader {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 50px 20px;
    background: var(--surface);
    border-radius: var(--radius);
    margin-bottom: 20px;
    box-shadow: var(--shadow);
}

.logo-spinner-container {
    position: relative;
    width: 130px;
    height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.loader-logo {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 50%;
    position: absolute;
    z-index: 2;
    border: 3px solid var(--surface);
    background: #000;
}

.spinner-ring {
    position: absolute;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 3px solid var(--border);
    border-top: 3px solid var(--primary);
    animation: spin 0.85s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

@keyframes dots {
    0%, 20% { opacity: 0.2; }
    50% { opacity: 1; }
    100% { opacity: 0.2; }
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.circle-loader p {
    margin-top: 24px;
    color: var(--primary);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.5px;
}

#outputArea { margin: 0 auto 30px; }

.data-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    animation: fadeUp 0.3s ease-out;
}

.record-header {
    background: rgba(37, 99, 235, 0.08);
    padding: 12px 16px;
    font-weight: 700;
    border-left: 4px solid var(--primary);
    border-radius: 6px;
    margin-bottom: 16px;
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--primary);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.copy-btn {
    background: transparent;
    border: none;
    color: var(--primary);
    cursor: pointer;
    font-size: 14px;
    padding: 4px 10px;
    border-radius: 6px;
    transition: background 0.2s;
}

.copy-btn:hover { background: rgba(37, 99, 235, 0.12); }

.info-row {
    padding: 13px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    gap: 12px;
}

.info-row:last-child { border-bottom: none; }

.label {
    color: var(--text-muted);
    font-weight: 600;
    letter-spacing: 0.5px;
    font-size: 12px;
    text-transform: uppercase;
    flex-shrink: 0;
}

.value {
    color: var(--text);
    font-weight: 600;
    text-align: right;
    word-break: break-word;
}

.map-section {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px;
    margin-top: 18px;
    box-shadow: var(--shadow);
}

.map-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
    color: var(--primary);
    text-transform: uppercase;
}

.map-wrapper {
    width: 100%;
    height: 280px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
}

.map-wrapper iframe {
    width: 100% !important;
    height: 100% !important;
}

.not-found {
    text-align: center;
    color: var(--danger);
    background: var(--surface);
    padding: 40px 20px;
    border-radius: var(--radius);
    font-weight: 600;
    box-shadow: var(--shadow);
    animation: fadeUp 0.3s ease-out;
}

.not-found i {
    font-size: 42px;
    display: block;
    margin-bottom: 14px;
    color: var(--danger);
}

.notice-box {
    margin: 20px auto;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    padding: 14px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 500;
}

footer {
    text-align: center;
    padding: 30px 20px 20px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
}

footer::before {
    content: '';
    display: block;
    width: 60px;
    height: 2px;
    background: var(--border);
    margin: 0 auto 20px;
    border-radius: 2px;
}

footer .footer-name {
    color: var(--primary);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-top: 6px;
}

.version-watermark {
    position: fixed;
    bottom: 10px;
    right: 15px;
    font-size: 9px;
    color: var(--text-muted);
    letter-spacing: 1px;
    z-index: 1;
    pointer-events: none;
    opacity: 0.5;
}

@media (max-width: 600px) {
    .main-title-first { font-size: 26px; }
    .main-title-second { font-size: 15px; letter-spacing: 2px; }
    .title-logo { width: 90px; height: 90px; margin-top: -95px; }
    .status-bar { flex-direction: column; gap: 6px; align-items: center; font-size: 10px; }
    .logo-spinner-container { width: 110px; height: 110px; }
    .spinner-ring { width: 110px; height: 110px; }
    .loader-logo { width: 85px; height: 85px; }
    .console-box { padding: 18px; }
    .info-row { font-size: 13px; }
}
</style>
</head>
<body>

<div class="main-wrapper">
    <div class="header-banner">
        <img src="https://i.ibb.co/mVFt9pJY/1791114360923.jpg" alt="AN Logo" class="title-logo">
        <div class="main-title-first">AHSAN x NOVA</div>
        <div class="main-title-second">DATABASE <span class="pro-color">PRO</span></div>
        <div class="status-bar">
            <span class="status-item"><span class="status-dot"></span> SYSTEM: ONLINE</span>
            <span class="status-item"><span class="status-dot cyan"></span> DATABASE: ACTIVE</span>
            <span class="status-item"><span class="status-dot warning"></span> ENCRYPTION: AES-256</span>
        </div>
    </div>

    <div class="console-box">
        <div class="console-header">
            <span>AHSAN x NOVA — FAST SCAN</span>
            <span class="dots">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
            </span>
        </div>
        <div class="input-group">
            <i class="fas fa-search"></i>
            <input type="text" id="targetInput" class="console-input" placeholder="Enter Mobile Number or CNIC (Press Enter)">
        </div>
        <button id="searchTrigger" class="btn-search">
            <i class="fas fa-bolt"></i> FAST SCAN
        </button>
    </div>

    <div id="outputArea"></div>

    <div class="notice-box">
        <i class="fas fa-info-circle"></i> NOTE: Database contains records up to 2023
    </div>

    <footer>
        <div>DEVELOPED BY</div>
        <div class="footer-name">AHSAN x NOVA</div>
    </footer>
</div>

<div class="version-watermark">v5 AHSAN x NOVA — PREMIUM EDITION</div>

<script>
const CONFIG = {
    api1: "https://famofc.site/api/database.php?number=",
    api2: "https://wasifali-sim-info.netlify.app/api/search?phone=",
    api3: "https://famofc.site/api/database.php?cnic="
};

async function executeFastScan() {
    const q = $('#targetInput').val().trim();
    if (!q) {
        alert("Please enter a number or CNIC");
        return;
    }

    // cache check
    if (executeFastScan._cache && executeFastScan._cache[q]) {
        $('#outputArea').html(executeFastScan._cache[q]);
        return;
    }
    executeFastScan._cache = executeFastScan._cache || {};

    $('#outputArea').html(`
        <div class="circle-loader">
            <div class="logo-spinner-container">
                <img src="https://i.ibb.co/mVFt9pJY/1791114360923.jpg" alt="AN Logo" class="loader-logo">
                <div class="spinner-ring"></div>
            </div>
            <p>SCANNING TARGET<span style="animation: dots 1.5s infinite;">...</span></p>
        </div>
    `);

    await new Promise(r => setTimeout(r, 700));

    try {
        const [res1, res2] = await Promise.all([
            fetch(CONFIG.api1 + encodeURIComponent(q)).then(r => r.json()).catch(() => null),
            fetch(CONFIG.api2 + encodeURIComponent(q)).then(r => r.json()).catch(() => null)
        ]);

        let records = [];

        if (res1) {
            if (res1.success && res1.data && res1.data.records) records = res1.data.records;
            else if (res1.records) records = res1.records;
            else if (Array.isArray(res1)) records = res1;
            else if (res1.name || res1.Name) records = [res1];
        }

        if (records.length === 0 && res2) {
            if (res2.records) records = res2.records;
            else if (Array.isArray(res2)) records = res2;
            else if (res2.name || res2.Name) records = [res2];
        }

        if (records.length > 0) {
            let html = `
                <div style="color:#10b981;font-size:13px;font-weight:600;margin-bottom:16px;text-align:center;">
                    ✓ SCAN COMPLETE — ${records.length} RECORDS FOUND
                </div>
            `;

            let mapLoc = "Pakistan";

            records.forEach((r, i) => {
                const name = r.full_name || r.Name || r.NAME || r.name || 'N/A';
                const phone = r.phone || r.Mobile || r.NUMBER || r.mobile || q;
                const cnic = r.cnic || r.CNIC || 'N/A';
                const addr = r.address || r.Address || r.ADDRESS || "Pakistan";
                if (i === 0 && addr !== "Pakistan") mapLoc = addr;

                html += `
                    <div class="data-card">
                        <div class="record-header">
                            <span>● RECORD ${i + 1}</span>
                            <button class="copy-btn" onclick="copyRecord(this)" title="Copy"><i class="fas fa-copy"></i></button>
                        </div>
                        <div class="info-row"><span class="label">NAME</span> <span class="value">${name}</span></div>
                        <div class="info-row"><span class="label">PHONE</span> <span class="value">${phone}</span></div>
                        <div class="info-row"><span class="label">CNIC</span> <span class="value">${cnic}</span></div>
                        <div class="info-row"><span class="label">ADDRESS</span> <span class="value">${addr}</span></div>
                    </div>
                `;
            });

            html += `
                <div class="map-section">
                    <div class="map-title">◉ LIVE LOCATION — ${mapLoc}</div>
                    <div class="map-wrapper">
                        <iframe width="100%" height="100%" frameborder="0" style="border:0;"
                            loading="lazy"
                            src="https://maps.google.com/maps?q=${encodeURIComponent(mapLoc)}&t=k&z=14&output=embed"
                            allowfullscreen></iframe>
                    </div>
                </div>
            `;

            executeFastScan._cache[q] = html;
            $('#outputArea').html(html);
        } else {
            const nfHtml = `
                <div class="not-found">
                    <i class="fas fa-skull"></i> NO DATA FOUND
                    <div style="font-size:12px;margin-top:12px;color:#64748b;font-weight:500;">Try another number or CNIC</div>
                </div>
            `;
            executeFastScan._cache[q] = nfHtml;
            $('#outputArea').html(nfHtml);
        }
    } catch (err) {
        console.error(err);
        $('#outputArea').html(`
            <div class="not-found">
                <i class="fas fa-bolt"></i> CONNECTION FAILED
                <div style="font-size:12px;margin-top:12px;color:#64748b;font-weight:500;">Check your internet and try again</div>
            </div>
        `);
    }
}

function copyRecord(btn) {
    const card = btn.closest('.data-card');
    const rows = card.querySelectorAll('.info-row');
    let text = '';
    rows.forEach(r => {
        const label = r.querySelector('.label').textContent.trim();
        const value = r.querySelector('.value').textContent.trim();
        text += `${label}: ${value}\n`;
    });
    navigator.clipboard.writeText(text).then(() => {
        btn.innerHTML = '<i class="fas fa-check"></i>';
        setTimeout(() => btn.innerHTML = '<i class="fas fa-copy"></i>', 1500);
    }).catch(() => {
        btn.innerHTML = '<i class="fas fa-times"></i>';
        setTimeout(() => btn.innerHTML = '<i class="fas fa-copy"></i>', 1500);
    });
}

$(document).ready(function() {
    $('#searchTrigger').on('click', executeFastScan);
    $('#targetInput').on('keypress', function(e) {
        if (e.which === 13) executeFastScan();
    });
});

document.addEventListener('keydown', function(e) {
    if (e.keyCode === 123) { e.preventDefault(); return false; }
    if (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) { e.preventDefault(); return false; }
    if (e.ctrlKey && [85, 83].includes(e.keyCode)) { e.preventDefault(); return false; }
});

document.addEventListener('contextmenu', function(e) { e.preventDefault(); });

console.log('%cAHSAN x NOVA', 'font-size:28px; font-weight:800; color:#2563eb;');
console.log('%cDATABASE PRO v5 — Parallel Scan Engine Active', 'font-size:13px; color:#0ea5e9; font-weight:600;');
console.log('%cPowered by AHSAN x NOVA', 'font-size:11px; color:#64748b;');
</script>

</body>
</html>
